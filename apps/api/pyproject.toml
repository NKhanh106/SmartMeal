[project]
name = "smartmeal-api"
version = "0.1.0"
description = "SmartMeal FastAPI backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    "B008",
    "B904",
    "UP006",
    "UP007",
    "UP017",
    "UP035",
    "UP038",
]
